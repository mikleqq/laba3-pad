# CI/CD of ShopHub.
#   push to main / pull request -> tests + manifest validation -> end-to-end test with Docker Compose
#   push to main                -> build the 7 images and publish them to GitHub Container Registry (ghcr.io)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

concurrency:                  # a newer push cancels the older run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ 1. tests
  test:
    name: Tests and manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            libs/common/pyproject.toml

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit, integration and manifest tests
        run: pytest -q --ignore=tests/e2e

      - name: Validate Kubernetes manifests against the API schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize k8s | ./kubeconform -strict -summary -

  # ------------------------------------------------------------------ 2. end-to-end
  e2e:
    name: End-to-end test (Docker Compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with random secrets (never stored in Git)
        run: |
          for key in POSTGRES_PASSWORD AUTH_DB_PASSWORD USER_DB_PASSWORD PRODUCT_DB_PASSWORD \
                     ORDER_DB_PASSWORD PAYMENT_DB_PASSWORD NOTIFICATION_DB_PASSWORD; do
            echo "$key=$(openssl rand -hex 16)" >> .env
          done
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "INTERNAL_TOKEN=$(openssl rand -hex 24)" >> .env
          echo "ADMIN_PASSWORD=Admin$(openssl rand -hex 6)1" >> .env

      - name: Start the whole system and wait until every container is healthy
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Run end-to-end tests through the gateway
        run: |
          pip install pytest httpx
          export ADMIN_PASSWORD=$(grep '^ADMIN_PASSWORD=' .env | cut -d= -f2)
          cd tests/e2e && pytest -q -c /dev/null --confcutdir=. -p no:cacheprovider .

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the system
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ 3. build & publish images
  build-push:
    name: Build image ${{ matrix.image }}
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # allows pushing to ghcr.io with the built-in GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth-service,         dockerfile: services/auth-service/Dockerfile }
          - { image: user-service,         dockerfile: services/user-service/Dockerfile }
          - { image: product-service,      dockerfile: services/product-service/Dockerfile }
          - { image: order-service,        dockerfile: services/order-service/Dockerfile }
          - { image: payment-service,      dockerfile: services/payment-service/Dockerfile }
          - { image: notification-service, dockerfile: services/notification-service/Dockerfile }
          - { image: gateway,              dockerfile: gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (commit SHA + latest on main)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
