# Stable internal address of product-service: http://product-service:8000 (DNS name inside the cluster).
# Traffic is spread over all READY pods with the label app=product-service.
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shophub
  labels:
    app: product-service
    app.kubernetes.io/part-of: shophub
spec:
  type: ClusterIP           # reachable only inside the cluster
  selector:
    app: product-service
  ports:
    - name: http
      port: 8000            # port of the Service
      targetPort: http      # named container port (8000)
